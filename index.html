<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Você ❤️</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           RESET E VARIÁVEIS GERAIS
        ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-color: #ffe6eb;
            --accent-pink: #ff3366;
            --dark-pink: #990033;
            --text-dark: #4a1525;
            --envelope-bg: #fca3b5;
            --envelope-inside: #ffa4b6;
            --envelope-pocket: #ffccd5;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: var(--bg-color);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-dark);
        }

        .app-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 450px;
            background: linear-gradient(135deg, #fff0f3 0%, #ffccd5 100%);
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        /* Fundo de Corações Flutuantes */
        #floating-hearts-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .floating-heart {
            position: absolute;
            bottom: -50px;
            color: rgba(255, 51, 102, 0.4);
            animation: floatUp linear infinite;
            filter: drop-shadow(0 4px 6px rgba(255, 51, 102, 0.15));
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(-110vh) scale(1.3) rotate(25deg); opacity: 0; }
        }

        /* Telas de Navegação */
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }

        .hidden { opacity: 0; pointer-events: none; transform: scale(0.95); }
        .active { opacity: 1; pointer-events: auto; transform: scale(1); }

        /* =========================================
           TELA 1: CORAÇÃO PARTIDO
        ========================================= */
        .heart-wrapper {
            position: relative;
            width: 300px;
            height: 300px;
            margin-bottom: 40px;
            z-index: 5;
        }

        .heart-half {
            fill: url(#heartGradient3D); 
            filter: drop-shadow(5px 15px 15px rgba(153, 0, 51, 0.4));
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .heart-wrapper.glow .heart-half {
            filter: drop-shadow(0 0 25px var(--accent-pink));
        }

        .btn-heal {
            background: linear-gradient(135deg, var(--accent-pink), #ff1a53);
            color: #fff;
            border: none;
            padding: 18px 40px;
            font-size: 1.15rem;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 51, 102, 0.3);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 10;
        }
        .btn-heal:active { transform: scale(0.92); }

        /* =========================================
           TELA 2: DISCO E SEU PLAYER
        ========================================= */
        #screen-2 { justify-content: flex-start; padding-top: 60px; }

        .title {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: var(--accent-pink);
            text-shadow: 2px 2px 0px #fff;
            margin-bottom: 35px;
        }

        .photo-disc-container {
            position: relative;
            width: 220px;
            height: 220px;
            margin-bottom: 35px;
        }

        .photo-disc {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #000000;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15); 
            animation: spin 15s linear infinite; 
            animation-play-state: paused; 
            overflow: hidden; 
            z-index: 2;
            position: relative;
        }

        .photo-disc.playing { animation-play-state: running; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .disc-image { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%); }

        /* NOTAS MUSICAIS MAIORES (ESTILO BALÃO SAINDO DO DISCO) */
        .music-note {
            position: absolute;
            color: var(--accent-pink);
            font-size: 34px; /* Maior e mais bonita */
            pointer-events: none;
            z-index: 6;
            user-select: none;
            filter: drop-shadow(0 2px 8px rgba(255, 51, 102, 0.4));
            animation: floatMusicBalloon 3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes floatMusicBalloon {
            0% {
                transform: translate(-50%, -50%) translateY(0) translateX(0) scale(0.4);
                opacity: 0;
            }
            15% { opacity: 1; }
            100% {
                transform: translate(-50%, -50%) translateY(-350px) translateX(var(--sway)) scale(1.3) rotate(var(--rot));
                opacity: 0;
            }
        }

        .music-player {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.85);
            padding: 10px 25px;
            border-radius: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            margin-bottom: 45px;
            border: 1px solid rgba(255, 255, 255, 1);
            backdrop-filter: blur(5px);
        }

        .btn-play {
            background: var(--accent-pink);
            color: #fff;
            border: none;
            width: 45px; height: 45px;
            border-radius: 50%;
            font-size: 1.2rem;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 51, 102, 0.3);
            padding-left: 3px;
        }
        .btn-play.playing-icon { padding-left: 0; }
        .track-info { font-weight: 700; font-size: 1rem; }

        .btn-open-letter {
            background: #fff;
            color: var(--accent-pink);
            border: 2px solid var(--accent-pink);
            padding: 15px 35px;
            font-size: 1.1rem;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }
        .btn-open-letter:active { transform: scale(0.95); background: var(--accent-pink); color: #fff; }

        /* =========================================
           MODAL E ENVELOPE (RECONSTRUÇÃO ANTIBUG)
        ========================================= */
        .letter-modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(45, 10, 20, 0.65);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        .letter-modal.active { opacity: 1; pointer-events: auto; }

        /* Movimentação sutil do envelope inteiro para compensar o papel */
        .envelope-wrapper-box {
            position: relative;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .envelope-wrapper-box.shift-down {
            transform: translateY(110px); /* Desce o envelope suavemente para abrir espaço em cima */
        }

        .envelope-container {
            position: relative;
            width: 310px;
            height: 200px;
            background-color: var(--envelope-inside);
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        /* ABA SUPERIOR DO ENVELOPE (Design Perfeito em Triângulo) */
        .envelope-flap {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--envelope-bg);
            clip-path: polygon(0 0, 100% 0, 50% 55%);
            transform-origin: top;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 4;
            border-radius: 12px 12px 0 0;
            filter: drop-shadow(0 4px 5px rgba(0,0,0,0.1));
        }

        /* BOLSO FRONTAL (Design que esconde e abraça o papel) */
        .envelope-pocket {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--envelope-pocket);
            clip-path: polygon(0 40%, 50% 68%, 100% 40%, 100% 100%, 0 100%);
            z-index: 3;
            border-radius: 0 0 12px 12px;
        }

        /* Selo de Coração */
        .heart-seal {
            position: absolute;
            top: 110px; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 34px;
            z-index: 4;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .envelope-container:hover .heart-seal { transform: translate(-50%, -50%) scale(1.15); }

        /* O PAPEL DA CARTA (Corrigido: Totalmente oculto no início) */
        .envelope-paper {
            position: absolute;
            bottom: 10px; left: 10px;
            width: 290px;
            height: 180px;
            background: #fffbfd;
            border-radius: 12px;
            z-index: 2;
            padding: 25px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0; /* Inicia invisível para não dar bugs visuais */
            transform: scale(0.95) translateY(0);
            
            border: 2px dashed rgba(255, 51, 102, 0.25);
            outline: 6px solid #fffbfd;
            outline-offset: -8px;

            transition: 
                transform 0.7s cubic-bezier(0.34, 1.3, 0.64, 1), 
                height 0.6s cubic-bezier(0.25, 1, 0.5, 1), 
                width 0.6s cubic-bezier(0.25, 1, 0.5, 1),
                left 0.6s cubic-bezier(0.25, 1, 0.5, 1),
                opacity 0.3s ease;
        }

        /* Mini corações decorativos fixos nos cantos do papel */
        .envelope-paper::before, .envelope-paper::after {
            content: '♥';
            position: absolute;
            font-size: 11px;
            color: rgba(255, 51, 102, 0.3);
        }
        .envelope-paper::before { top: 12px; left: 12px; }
        .envelope-paper::after { bottom: 12px; right: 12px; }

        /* Caixa de Texto com Rolagem de Segurança Interna */
        .letter-content-box {
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.4s ease, transform 0.4s ease;
            text-align: center;
            width: 100%;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .letter-text {
            font-size: 1.1rem;
            line-height: 1.6;
            font-weight: 600;
            color: #400d1a;
        }

        .letter-sender {
            font-family: 'Dancing Script', cursive;
            font-size: 1.9rem;
            color: var(--accent-pink);
            margin-top: 15px;
        }

        .btn-close-letter {
            margin-top: auto;
            background: linear-gradient(135deg, var(--accent-pink), #ff1a53);
            color: #fff;
            border: none;
            padding: 10px 26px;
            font-size: 0.95rem;
            border-radius: 25px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 51, 102, 0.2);
            opacity: 0;
            transition: opacity 0.3s ease;
            margin-bottom: 5px;
        }

        /* -----------------------------------------
           TIMELINE CORRETA DE ANIMAÇÃO 
        ----------------------------------------- */
        
        /* Passo 1: Aba abre para cima */
        .envelope-container.flap-open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 1; /* Vai para trás do papel */
        }
        .envelope-container.flap-open .heart-seal {
            opacity: 0;
            transform: translate(-50%, -150%) scale(0);
        }

        /* Passo 2: Papel sai do bolso e ganha tamanho majestoso e centralizado */
        .envelope-container.paper-open .envelope-paper {
            opacity: 1;
            transform: translateY(-260px) scale(1);
            height: 390px;
            width: 330px;
            left: -10px;
            z-index: 5; /* Sobressai diante do bolso */
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            padding-top: 35px;
        }

        .envelope-container.paper-open .letter-content-box,
        .envelope-container.paper-open .btn-close-letter {
            opacity: 1;
            transform: translateY(0);
            transition-delay: 0.35s;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div id="floating-hearts-bg"></div>

        <div id="screen-1" class="screen active">
            <div class="heart-wrapper" id="heart-wrapper">
                <svg viewBox="-50 -50 200 200" width="100%" height="100%">
                    <defs>
                        <radialGradient id="heartGradient3D" cx="30" cy="20" r="80" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#ff99bb"/>   
                            <stop offset="40%" stop-color="#ff1a53"/>  
                            <stop offset="100%" stop-color="#800020"/> 
                        </radialGradient>
                    </defs>
                    <path id="heart-left" class="heart-half" d="M 50 25 C 35 0 0 5 0 40 C 0 65 25 80 50 95 L 47 80 L 53 65 L 47 50 L 53 35 Z" />
                    <path id="heart-right" class="heart-half" d="M 50 25 C 65 0 100 5 100 40 C 100 65 75 80 50 95 L 47 80 L 53 65 L 47 50 L 53 35 Z" />
                </svg>
            </div>
            <button class="btn-heal" id="btn-heal">Consertar coração (0/5)</button>
        </div>

        <div id="screen-2" class="screen hidden">
            <h1 class="title">Te Amo</h1>

            <div class="photo-disc-container" id="photo-disc-container">
                <div class="photo-disc" id="photo-disc">
                    <img src="nossafoto.jpg" alt="Nossa Foto" class="disc-image">
                </div>
            </div>

            <div class="music-player">
                <button class="btn-play" id="btn-play">▶</button>
                <span class="track-info">Nossa Música Especial</span>
            </div>

            <button class="btn-open-letter" id="trigger-letter">Abrir Carta Especial ✉️</button>

            <audio id="bg-music" loop>
                <source src="nossamusica.mp3" type="audio/mpeg">
            </audio>
        </div>

        <div class="letter-modal" id="letter-modal">
            <div class="envelope-wrapper-box" id="envelope-wrapper-box">
                <div class="envelope-container" id="envelope">
                    <div class="envelope-flap"></div>
                    <div class="heart-seal" id="heart-seal">❤️</div>
                    
                    <div class="envelope-paper">
                        <div class="letter-content-box">
                            <p class="letter-text">
                                Colei cada pedacinho do meu coração para te entregar por inteiro. <br><br>
                                Você é a minha melhor melodia, a única pessoa capaz de transformar meus dias comuns em pura poesia. 💖
                            </p>
                            <div class="letter-sender">Com todo meu amor, [Seu Nome]</div>
                        </div>
                        <button class="btn-close-letter" id="close-letter">Fechar Recado ✕</button>
                    </div>

                    <div class="envelope-pocket"></div>
                </div>
            </div>
        </div>

    </div>

    <script>
        /* --- Animação de Fundo (Balões de Coração) --- */
        const bgContainer = document.getElementById('floating-hearts-bg');
        const heartSymbols = ['❤️', '💖', '💕', '💗'];
        
        for (let i = 0; i < 22; i++) {
            let heart = document.createElement('div');
            heart.classList.add('floating-heart');
            heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
            heart.style.left = `${Math.random() * 100}%`;
            heart.style.animationDuration = `${6 + Math.random() * 8}s`;
            heart.style.animationDelay = `${Math.random() * 5}s`;
            heart.style.fontSize = `${16 + Math.random() * 22}px`;
            bgContainer.appendChild(heart);
        }

        /* --- Lógica dos 5 Cliques para Curar o Coração --- */
        let clicks = 0;
        const maxClicks = 5;
        const btnHeal = document.getElementById('btn-heal');
        const heartLeft = document.getElementById('heart-left');
        const heartRight = document.getElementById('heart-right');
        const heartWrapper = document.getElementById('heart-wrapper');
        
        const startState = { left: { x: -35, y: -15, rot: -15 }, right: { x: 35, y: 15, rot: 15 } };

        function updateHeartPosition() {
            const ease = 1 - (clicks / maxClicks); 
            heartLeft.style.transform = `translate(${startState.left.x * ease}px, ${startState.left.y * ease}px) rotate(${startState.left.rot * ease}deg)`;
            heartRight.style.transform = `translate(${startState.right.x * ease}px, ${startState.right.y * ease}px) rotate(${startState.right.rot * ease}deg)`;
        }
        updateHeartPosition();

        btnHeal.addEventListener('click', () => {
            if (clicks < maxClicks) {
                clicks++;
                updateHeartPosition();
                if (clicks < maxClicks) {
                    btnHeal.textContent = `Consertando... (${clicks}/${maxClicks})`;
                } else {
                    btnHeal.textContent = "Coração curado! ❤️";
                    btnHeal.style.pointerEvents = 'none';
                    btnHeal.style.opacity = '0';
                    heartWrapper.classList.add('glow');

                    setTimeout(() => {
                        document.getElementById('screen-1').className = 'screen hidden';
                        document.getElementById('screen-2').className = 'screen active';
                    }, 1400);
                }
            }
        });

        /* --- Lógica de Áudio e Notas Maiores (Efeito Balão do Disco) --- */
        const btnPlay = document.getElementById('btn-play');
        const photoDisc = document.getElementById('photo-disc');
        const discContainer = document.getElementById('photo-disc-container');
        const audio = document.getElementById('bg-music');
        let isPlaying = false;
        let noteInterval = null;

        function spawnMusicNoteBalloon() {
            const notes = ['🎵', '🎶', '♪', '💖', '♩', '💗'];
            const note = document.createElement('div');
            note.classList.add('music-note');
            note.innerText = notes[Math.floor(Math.random() * notes.length)];

            // Origem no centro absoluto do Disco
            note.style.left = '50%';
            note.style.top = '50%';

            // Balanço realista de balão subindo
            const sway = -70 + Math.random() * 140;
            const rot = -40 + Math.random() * 80;
            note.style.setProperty('--sway', `${sway}px`);
            note.style.setProperty('--rot', `${rot}deg`);
            note.style.animationDuration = `${2.5 + Math.random() * 1}s`;

            discContainer.appendChild(note);
            setTimeout(() => { note.remove(); }, 3500);
        }

        btnPlay.addEventListener('click', () => {
            if (isPlaying) {
                photoDisc.classList.remove('playing');
                btnPlay.textContent = '▶';
                btnPlay.classList.remove('playing-icon');
                clearInterval(noteInterval);
                try { audio.pause(); } catch(e) {}
            } else {
                photoDisc.classList.add('playing');
                btnPlay.textContent = '⏸';
                btnPlay.classList.add('playing-icon');
                noteInterval = setInterval(spawnMusicNoteBalloon, 450);
                audio.play().catch(() => console.log("Modo de simulação ativo."));
            }
            isPlaying = !isPlaying;
        });

        /* --- TIMELINE ANTIBUG DA CARTA (ENTRA E SAI DO BOLSO PERFEITAMENTE) --- */
        const triggerLetter = document.getElementById('trigger-letter');
        const letterModal = document.getElementById('letter-modal');
        const envelopeWrapper = document.getElementById('envelope-wrapper-box');
        const envelope = document.getElementById('envelope');
        const closeLetter = document.getElementById('close-letter');

        // 1. Abre o Modal Geral
        triggerLetter.addEventListener('click', () => {
            letterModal.classList.add('active');
        });

        // 2. Corografia sequencial para abrir
        function openEnvelopeSequence() {
            if(envelope.classList.contains('flap-open')) return;

            // Passo A: Envelope desce um pouco e a tampa levanta
            envelopeWrapper.classList.add('shift-down');
            envelope.classList.add('flap-open');

            // Passo B: O papel desliza de dentro do bolso para cima e se expande
            setTimeout(() => {
                envelope.classList.add('paper-open');
            }, 400); 
        }

        envelope.addEventListener('click', (e) => {
            if (e.target.id === 'close-letter' || envelope.classList.contains('paper-open')) return;
            openEnvelopeSequence();
        });

        // 3. Engenharia Reversa Fluida para Fechar
        closeLetter.addEventListener('click', (e) => {
            e.stopPropagation(); 

            // Passo Reverso A: O papel entra completamente de volta no bolso
            envelope.classList.remove('paper-open');

            // Passo Reverso B: A tampa fecha e o envelope volta para o centro
            setTimeout(() => {
                envelope.classList.remove('flap-open');
                envelopeWrapper.classList.remove('shift-down');
            }, 550);

            // Passo Reverso C: Apaga o modal inteiro da tela após tudo estar recolhido
            setTimeout(() => {
                letterModal.classList.remove('active');
            }, 1050);
        });
    </script>
</body>
</html>
